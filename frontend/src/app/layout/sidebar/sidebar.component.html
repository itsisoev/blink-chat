<aside class="sidebar">
  <div class="sidebar__header">
    <mat-form-field appearance="outline" class="search">
      <mat-label>Search users</mat-label>
      <input matInput type="search" placeholder="Search users" />
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="users">
    @for (user of users(); track user.uuid) {
      <div class="user">
        <div class="user__avatar">
          <img [src]="user.avatar" [alt]="user.name" />

          <span
            class="user__status"
            [class.user__status--online]="user.online"
          ></span>
        </div>

        <div class="user__info">
          <span class="user__name">{{ user.name }}</span>
          <span class="user__presence">
            {{ user.online ? 'Online' : 'Offline' }}
          </span>
        </div>
      </div>
    }
  </div>

  <footer class="sidebar__footer">
    <div class="profile">
      <div class="profile__avatar">
        <img
          src="https://i.pravatar.cc/150?img=12"
          alt="Alex"
        />
        <span class="profile__status"></span>
      </div>

      <div class="profile__info">
        <span class="profile__name">Alex</span>
        <span class="profile__presence">Online</span>
      </div>

      <div class="profile__menu">
        <app-ui-menu
          [items]="profileMenu()"
          (itemSelected)="onMenuItemSelected($event)"
        />
      </div>
    </div>
  </footer>
</aside>
