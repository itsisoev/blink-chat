<aside class="sidebar">
  <div class="sidebar__header">
    <mat-form-field appearance="outline" class="search">
      <mat-label>Search users</mat-label>
      <input matInput type="search" placeholder="Search users" />
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
  </div>

  <app-sidebar-list
    [items]="users()"
    (itemSelected)="onUserSelected($event)"
    (findFriendsClicked)="onFindFriendsClick()"
  />

  <footer class="sidebar__footer">
    <div class="profile">
      <div class="profile__avatar">
        <img
          src="https://i.pravatar.cc/150?img=12"
          alt="Alex"
        />
        <span class="profile__status"></span>
      </div>

      <div class="profile__info">
        <span class="profile__name">Alex</span>
        <span class="profile__presence">Online</span>
      </div>

      <div class="profile__menu">
        <app-ui-menu
          [items]="profileMenu()"
          (itemSelected)="onMenuItemSelected($event)"
        />
      </div>
    </div>
  </footer>
</aside>
