<div class="chat-header">
  <div class="chat-header__user">
    <button
      mat-icon-button
      class="chat-header__back"
      type="button"
      aria-label="Back to list"
      (click)="backClicked.emit()"
    >
      <mat-icon>
        arrow_back
      </mat-icon>
    </button>

    <img
      class="chat-header__avatar"
      [src]="user().avatar"
      [alt]="user().name"
    />

    <span class="chat-header__name">
      {{ user().name }}
    </span>
  </div>

  <div class="chat-header__actions">
    <span
      class="chat-header__status"
      [class.chat-header__status--online]="user().online"
    >
      {{ user().online ? 'Online' : 'Offline' }}
    </span>

    <app-ui-menu
      [items]="menuItems"
      (itemSelected)="menuItemSelected.emit($event)"
    />
  </div>
</div>
