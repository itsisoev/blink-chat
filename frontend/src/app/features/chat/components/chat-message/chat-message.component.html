<div class="chat-message">
  <div class="chat-message__list">
    @for (message of messageGroups(); track message.uuid) {
      <div
        class="chat-message__item"
        [class.chat-message__item--own]="message.isOwn"
      >
        <div class="chat-message__content">
          @if (message.isOwn) {
            <div
              class="chat-message__menu"
              (click)="onMessageMenuClicked(message)"
            >
              <app-ui-menu
                [items]="messageMenuItems"
                (itemSelected)="onMenuItemSelected($event)"
              />
            </div>
          }

          <div class="chat-message__bubble">
            <div class="chat-message__text">
              {{ message.text }}
            </div>

            <time class="chat-message__time">
              {{ message.createdAt | date: 'HH:mm' }}
            </time>
          </div>
        </div>
      </div>
    }
  </div>
</div>
